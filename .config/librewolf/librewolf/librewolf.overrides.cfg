// vim: ft=javascript

// https://codeberg.org/librewolf/settings/src/branch/master/librewolf.cfg

defaultPref("browser.aboutConfig.showWarning", false);

defaultPref("privacy.clearOnShutdown.cookies", false);
defaultPref("privacy.resistFingerprinting.exemptedDomains", "localhost");
// defaultPref("identity.fxaccounts.enabled", true);

defaultPref("browser.nova.enabled", true);
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
defaultPref("widget.transparent-windows", true);
defaultPref("browser.tabs.allow_transparent_browser", true);
defaultPref("sidebar.verticalTabs", true);
defaultPref("sidebar.verticalTabs.dragToPinPromo.dismissed", true);
defaultPref("sidebar.main.tools", "history,bookmarks");

pref("devtools.debugger.remote-enabled", true);
defaultPref("devtools.chrome.enabled", true);
defaultPref("xpinstall.signatures.required", false);
defaultPref("extensions.langpacks.signatures.required", false);

defaultPref("browser.newtabpage.activity-stream.nova.enabled", false);
defaultPref("browser.newtabpage.activity-stream.feeds.topsites", false);
defaultPref(
  "browser.newtabpage.activity-stream.improvesearch.handoffToAwesomebar",
  false,
);
defaultPref("browser.urlbar.suggest.history", false);
defaultPref("browser.urlbar.suggest.recentsearches", false);
defaultPref("browser.urlbar.suggest.topsites", false);
defaultPref("browser.urlbar.suggest.trending", false);

defaultPref("image.jxl.enabled", true)
